<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tela</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form id="join" class="card">
    <h1>📺 Tela</h1>
    <p class="muted">Compartilhe a tela com os amigos pelo navegador, com o mínimo de atraso.</p>
    <label>Seu nome
      <input id="name" maxlength="32" placeholder="Ex.: João" autocomplete="nickname" required>
    </label>
    <label>Sala
      <input id="room" maxlength="64" required>
    </label>
    <button class="primary" type="submit">Entrar</button>
    <p class="muted small">Quem entrar na mesma sala vê as telas compartilhadas.</p>
  </form>

  <main id="app" hidden>
    <header class="bar">
      <strong class="title">📺 Sala <span id="roomName"></span></strong>
      <button id="copy" type="button">Copiar link</button>
      <div class="spacer"></div>
      <label>Qualidade
        <select id="quality">
          <option value="squad" selected>Squad · 720p · 60 fps</option>
          <option value="light">Leve · 720p · 30 fps</option>
          <option value="720">720p · 60 fps</option>
          <option value="1080">1080p · 60 fps</option>
          <option value="1440">1440p · 60 fps</option>
          <option value="0">Original · 60 fps</option>
        </select>
      </label>
      <label>Modo
        <select id="mode">
          <option value="motion">Fluidez (jogos, vídeos)</option>
          <option value="detail">Nitidez (texto, código)</option>
        </select>
      </label>
      <label>Codec
        <select id="codec">
          <option value="H264">H.264 (recomendado)</option>
          <option value="VP8">VP8</option>
          <option value="VP9">VP9</option>
          <option value="AV1">AV1</option>
        </select>
      </label>
      <label class="check" title="Tela inteira: áudio do PC todo. Janela: só o áudio daquela janela. Aba: só o áudio da aba. Lembre de marcar a opção de áudio na janela de escolha do navegador.">
        <input type="checkbox" id="audio" checked> Áudio
      </label>
      <label title="Mistura outra entrada de áudio na transmissão. Para o TeamSpeak: mande a saída dele para um cabo virtual (ex.: VB-Cable) e escolha o cabo aqui.">Áudio extra
        <select id="extraAudio"><option value="">Nenhum</option></select>
      </label>
      <button id="pip" type="button" title="Abre uma janela por cima dos outros programas com as telas dos amigos. Abra antes de entrar no jogo (o jogo precisa estar em modo sem bordas/Borderless).">Abrir PiP</button>
      <button id="share" class="primary" type="button">Compartilhar tela</button>
    </header>

    <div class="layout">
      <aside>
        <h2>Na sala</h2>
        <ul id="people"></ul>
      </aside>
      <section id="grid">
        <p id="empty" class="muted">Ninguém está compartilhando ainda.</p>
      </section>
    </div>
  </main>

  <div id="banner" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
